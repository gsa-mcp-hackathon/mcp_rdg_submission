<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="450" viewBox="0 0 1600 950">

  <defs>
    <linearGradient id="headerBlue" x1="0" x2="1">
      <stop offset="0%" stop-color="#12335f"/>
      <stop offset="100%" stop-color="#1d5c88"/>
    </linearGradient>

    <linearGradient id="ruralBanner" x1="0" x2="1">
      <stop offset="0%" stop-color="#14285f"/>
      <stop offset="50%" stop-color="#263b91"/>
      <stop offset="100%" stop-color="#112253"/>
    </linearGradient>

    <linearGradient id="femaHeader" x1="0" x2="1">
      <stop offset="0%" stop-color="#e9eef1"/>
      <stop offset="100%" stop-color="#f8fafb"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7"
                    flood-color="#102a43" flood-opacity=".18"/>
    </filter>

    <marker id="arrow" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#39739d"/>
    </marker>

    <style>
      .title {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        fill: #17324d;
      }
      .body {
        font-family: Arial, Helvetica, sans-serif;
        fill: #29465e;
      }
      .small {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        fill: #456174;
      }
      .thumb-title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: #17324d;
      }
      .step-label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: white;
      }
      .ui-text {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        fill: #243b53;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#f5f8fa"/>

  <!-- plain -->
  <rect x="80" y="155" width="1440" height="65" rx="10"
        fill="#e6f0f6" stroke="#b8d1df"/>
  <text x="110" y="195" class="body" font-size="21">
    The calculation requires downloading county-level data, identifying disaster-area counties,
    and matching the two datasets.
  </text>

  <!-- Connecting arrows between thumbnails -->
  <line x1="485" y1="490" x2="555" y2="490"
        stroke="#39739d" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1005" y1="490" x2="1075" y2="490"
        stroke="#39739d" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- THUMBNAIL 1: Rural Data Gateway -->
  <g filter="url(#shadow)">
    <rect x="80" y="270" width="405" height="390" rx="12" fill="white"/>
  </g>

  <!-- Step badge -->
  <circle cx="116" cy="307" r="25" fill="#226b8f"/>
  <text x="116" y="314" text-anchor="middle" class="step-label">1</text>
  <text x="155" y="315" class="thumb-title">Rural Data Gateway</text>

  <!-- Simplified USDA browser window -->
  <rect x="105" y="350" width="355" height="275" rx="4"
        fill="#ffffff" stroke="#b6c6d0"/>

  <!-- browser bar -->
  <rect x="105" y="350" width="355" height="25" fill="#e7edf1"/>
  <circle cx="119" cy="362" r="4" fill="#d96b61"/>
  <circle cx="132" cy="362" r="4" fill="#e1ae48"/>
  <circle cx="145" cy="362" r="4" fill="#61a875"/>
  <rect x="170" y="357" width="200" height="11" rx="5" fill="white"
        stroke="#c5d0d7"/>

  <!-- USDA header -->
  <rect x="105" y="375" width="355" height="49" fill="white"/>
  <rect x="120" y="385" width="32" height="24" fill="#13805a"/>
  <path d="M120 397 L136 386 L152 397 L152 409 L120 409 Z"
        fill="#0b5b43"/>
  <text x="160" y="397" font-family="Georgia, serif" font-size="15"
        fill="#1c5780">USDA Rural Development</text>
  <text x="160" y="413" class="ui-text" font-size="9">
    U.S. Department of Agriculture
  </text>

  <!-- Navigation -->
  <rect x="105" y="424" width="355" height="22" fill="#142956"/>
  <text x="124" y="439" font-family="Arial" font-size="9" fill="white">
    ABOUT RD
  </text>
  <text x="195" y="439" font-family="Arial" font-size="9" fill="white">
    PROGRAMS
  </text>
  <text x="275" y="439" font-family="Arial" font-size="9" fill="white">
    RESOURCES
  </text>
  <text x="370" y="439" font-family="Arial" font-size="9" fill="white">
    HELP
  </text>

  <!-- Banner -->
  <rect x="105" y="446" width="355" height="75" fill="url(#ruralBanner)"/>
  <circle cx="170" cy="480" r="25" fill="#ef5d74" opacity=".55"/>
  <circle cx="225" cy="462" r="16" fill="#f36d7c" opacity=".45"/>
  <line x1="145" y1="500" x2="270" y2="453"
        stroke="#f66f88" stroke-width="3"/>
  <line x1="210" y1="520" x2="300" y2="448"
        stroke="#3d8de0" stroke-width="3"/>
  <text x="275" y="486" font-family="Arial" font-size="18"
        font-weight="700" fill="white">Rural Data Gateway</text>

  <!-- Dashboard content -->
  <rect x="105" y="521" width="355" height="104" fill="#2b6394"/>
  <text x="124" y="545" font-family="Arial" font-size="14"
        font-weight="700" fill="white">Rural Development Data and Tools</text>
  <rect x="124" y="558" width="95" height="47" rx="3" fill="white"/>
  <rect x="232" y="558" width="95" height="47" rx="3" fill="white"/>
  <rect x="340" y="558" width="95" height="47" rx="3" fill="white"/>
  <text x="171" y="579" text-anchor="middle" class="ui-text">Investments</text>
  <text x="171" y="596" text-anchor="middle" class="ui-text">by state</text>
  <text x="279" y="579" text-anchor="middle" class="ui-text">County-level</text>
  <text x="279" y="596" text-anchor="middle" class="ui-text">data</text>
  <text x="387" y="579" text-anchor="middle" class="ui-text">Export or</text>
  <text x="387" y="596" text-anchor="middle" class="ui-text">download</text>

  <text x="105" y="695" class="small">
    Access USDA Rural Development data
  </text>

  <!-- THUMBNAIL 2: Download data -->
  <g filter="url(#shadow)">
    <rect x="555" y="270" width="450" height="390" rx="12" fill="white"/>
  </g>

  <circle cx="591" cy="307" r="25" fill="#a96f24"/>
  <text x="591" y="314" text-anchor="middle" class="step-label">2</text>
  <text x="630" y="315" class="thumb-title">Download state and county data</text>

  <!-- Simplified download interface -->
  <rect x="580" y="350" width="400" height="275" rx="4"
        fill="#ffffff" stroke="#b6c6d0"/>

  <rect x="580" y="350" width="400" height="35" fill="#edf1f3"/>
  <text x="600" y="373" class="ui-text" font-weight="700">
    Data Download
  </text>
  <rect x="875" y="357" width="82" height="21" rx="3" fill="#2c6d95"/>
  <text x="916" y="372" text-anchor="middle"
        font-family="Arial" font-size="10" fill="white">DOWNLOAD</text>

  <!-- Filters -->
  <text x="600" y="410" class="ui-text" font-weight="700">State</text>
  <rect x="600" y="418" width="155" height="27" fill="white" stroke="#9eb2bf"/>
  <text x="612" y="436" class="ui-text">Select state</text>
  <path d="M738 428 l8 0 l-4 6 z" fill="#527184"/>

  <text x="780" y="410" class="ui-text" font-weight="700">Fiscal year</text>
  <rect x="780" y="418" width="155" height="27" fill="white" stroke="#9eb2bf"/>
  <text x="792" y="436" class="ui-text">Select year</text>
  <path d="M918 428 l8 0 l-4 6 z" fill="#527184"/>

  <!-- Table -->
  <rect x="600" y="470" width="335" height="25" fill="#2e648a"/>
  <text x="610" y="487" font-family="Arial" font-size="10"
        font-weight="700" fill="white">State</text>
  <text x="680" y="487" font-family="Arial" font-size="10"
        font-weight="700" fill="white">County</text>
  <text x="770" y="487" font-family="Arial" font-size="10"
        font-weight="700" fill="white">Program</text>
  <text x="875" y="487" font-family="Arial" font-size="10"
        font-weight="700" fill="white">Obligations</text>

  <g class="ui-text">
    <rect x="600" y="495" width="335" height="25" fill="#f5f8fa"/>
    <text x="610" y="512">State A</text>
    <text x="680" y="512">County 1</text>
    <text x="770" y="512">Housing</text>
    <text x="875" y="512">$1.2M</text>

    <rect x="600" y="520" width="335" height="25" fill="white"/>
    <text x="610" y="537">State A</text>
    <text x="680" y="537">County 2</text>
    <text x="770" y="537">Utilities</text>
    <text x="875" y="537">$850K</text>

    <rect x="600" y="545" width="335" height="25" fill="#f5f8fa"/>
    <text x="610" y="562">State A</text>
    <text x="680" y="562">County 3</text>
    <text x="770" y="562">Business</text>
    <text x="875" y="562">$430K</text>

    <rect x="600" y="570" width="335" height="25" fill="white"/>
    <text x="610" y="587">State A</text>
    <text x="680" y="587">County 4</text>
    <text x="770" y="587">Housing</text>
    <text x="875" y="587">$710K</text>
  </g>

  <text x="580" y="695" class="small">
    Download all relevant counties for the selected state
  </text>

  <!-- THUMBNAIL 3: FEMA -->
  <g filter="url(#shadow)">
    <rect x="1075" y="270" width="445" height="390" rx="12" fill="white"/>
  </g>

  <circle cx="1111" cy="307" r="25" fill="#17618e"/>
  <text x="1111" y="314" text-anchor="middle" class="step-label">3</text>
  <text x="1150" y="315" class="thumb-title">Identify FEMA disaster counties</text>

  <!-- Simplified FEMA browser -->
  <rect x="1100" y="350" width="395" height="275" rx="4"
        fill="white" stroke="#b6c6d0"/>

  <!-- FEMA header -->
  <rect x="1100" y="350" width="395" height="55" fill="url(#femaHeader)"/>
  <circle cx="1130" cy="377" r="19" fill="#174f78"/>
  <circle cx="1130" cy="377" r="13" fill="white"/>
  <text x="1158" y="384" font-family="Georgia, serif"
        font-size="23" font-weight="700" fill="#17618e">FEMA</text>
  <rect x="1365" y="363" width="105" height="22" fill="white"
        stroke="#c6d0d5"/>
  <text x="1373" y="377" class="ui-text" font-size="9">Search FEMA.gov</text>

  <!-- FEMA navigation -->
  <rect x="1100" y="405" width="395" height="25" fill="#07547f"/>
  <text x="1117" y="421" font-family="Arial" font-size="10"
        font-weight="700" fill="white">DISASTERS</text>
  <text x="1200" y="421" font-family="Arial" font-size="10"
        font-weight="700" fill="white">GRANTS</text>
  <text x="1260" y="421" font-family="Arial" font-size="10"
        font-weight="700" fill="white">MAPS</text>
  <text x="1315" y="421" font-family="Arial" font-size="10"
        font-weight="700" fill="white">ABOUT</text>

  <!-- FEMA content -->
  <text x="1120" y="459" font-family="Georgia, serif"
        font-size="20" font-weight="700" fill="#17618e">
    Disasters and Other Declarations
  </text>

  <text x="1120" y="482" class="ui-text" font-weight="700">Declaration type</text>
  <rect x="1120" y="489" width="155" height="25" fill="white"
        stroke="#9eb2bf"/>
  <text x="1130" y="506" class="ui-text">Major Disaster</text>

  <text x="1290" y="482" class="ui-text" font-weight="700">State / Tribe</text>
  <rect x="1290" y="489" width="155" height="25" fill="white"
        stroke="#9eb2bf"/>
  <text x="1300" y="506" class="ui-text">Select state</text>

  <rect x="1120" y="527" width="125" height="25" rx="3" fill="#076193"/>
  <text x="1182" y="544" text-anchor="middle"
        font-family="Arial" font-size="10" font-weight="700" fill="white">
    SEARCH
  </text>

  <rect x="1120" y="568" width="325" height="36" fill="#e7f0f5"
        stroke="#a7c5d5"/>
  <text x="1132" y="584" font-family="Arial" font-size="10"
        font-weight="700" fill="#17618e">
    Major Disaster Declaration
  </text>
  <text x="1132" y="598" class="ui-text">
    Affected counties: County 1, County 3
  </text>

  <text x="1100" y="695" class="small">
    Determine which counties are included in the declaration
  </text>

  <!-- Downward connector -->
  <line x1="800" y1="720" x2="800" y2="775"
        stroke="#39739d" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Analysis box -->
  <g filter="url(#shadow)">
    <rect x="295" y="775" width="1010" height="115" rx="14"
          fill="#fffdf7" stroke="#c89442" stroke-width="3"/>
  </g>

  <circle cx="350" cy="832" r="29" fill="#a96f24"/>
  <text x="350" y="840" text-anchor="middle" class="step-label">4</text>

  <text x="400" y="815" class="title" font-size="25">
    Match, flag, and summarize
  </text>
  <text x="400" y="849" class="body" font-size="19">
    In Excel or another analysis tool, match the FEMA counties to the
    county-level Rural Development data.
  </text>
  <text x="400" y="878" class="body" font-size="19">
    Flag the matching records and total their obligation amounts.
  </text>

  <!-- Result box -->
  <rect x="80" y="910" width="1440" height="0" fill="none"/>

  <!-- Formula footer -->
  <rect x="80" y="910" width="1440" height="0" fill="none"/>
  <text x="800" y="925" text-anchor="middle"
        font-family="Arial" font-size="18" font-weight="700" fill="#17324d">
    Result: Obligations in FEMA disaster counties ÷ Total state obligations × 100
  </text>

</svg>